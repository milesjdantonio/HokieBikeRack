; HokieBikeRack firmware build settings.
;
;   pio run                 -> build for the ESP32 (env:esp32dev)
;   pio run -t upload       -> flash the ESP32
;   pio run -t uploadfs     -> (not needed) the LittleFS partition is formatted on first boot
;   pio device monitor      -> open the serial monitor (115200 baud)
;   pio test -e native      -> run the hardware-free unit tests on your PC
;
; See docs/notes/firmware.md for what each setting means.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The default partition table only gives the app 1.25 MB and we were already at
; 92% before adding the NFC/servo code. huge_app gives the app 3 MB and still
; keeps a ~900 KB data partition that LittleFS uses for the event queue.
; Trade-off: no room for over-the-air (OTA) updates. Fine for a USB-flashed demo.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit PN532@^1.3.4
  madhephaestus/ESP32Servo@^3.0.6
; Unit tests only run on the PC (env:native); don't try to build them for the board.
test_ignore = *

; Hardware-free logic tests. Everything under lib/hbr_logic is plain C++ with
; no Arduino calls, so it compiles with your PC's g++ (MSYS2 on this machine).
[env:native]
platform = native
build_flags =
  -std=gnu++17
  -Wall
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
test_framework = unity
