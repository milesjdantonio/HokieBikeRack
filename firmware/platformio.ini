; HokieBikeRack firmware build settings (Arduino Uno R3).
;
;   pio run                 -> build for the Uno (env:uno)
;   pio run -t upload       -> flash the Uno over USB
;   pio device monitor      -> open the serial monitor (115200 baud)
;   pio test -e native      -> run the hardware-free unit tests on your PC
;
; On this laptop, Windows blocks pio.exe; run it through Python instead:
;   ~/.platformio/penv/Scripts/python.exe -m platformio run
;
; See docs/notes/firmware.md for what each setting means.
; The last ESP32 version (Wi-Fi + backend sync) is saved as the git tag
; `esp32-final`.

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
  adafruit/Adafruit PN532@^1.3.4
  arduino-libraries/Servo@^1.2.2
; Unit tests only run on the PC (env:native); don't try to build them for the board.
test_ignore = *

; Hardware-free logic tests. Everything under lib/hbr_logic is plain C++ with
; no Arduino calls, so it compiles with your PC's g++ (MSYS2 on this machine).
[env:native]
platform = native
build_flags =
  -std=gnu++17
  -Wall
test_framework = unity
