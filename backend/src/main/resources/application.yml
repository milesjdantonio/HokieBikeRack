# Local defaults only; override through environment variables.
spring:
  application:
    name: hokiebikerack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hokiebikerack}
    username: ${DB_USERNAME:hokiebikerack}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
