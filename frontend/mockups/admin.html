<!doctype html>
<!--
  MOCKUP of the new admin site (docs/notes/frontend-plan.md), style B1 "floating" chosen by Miles.
  Sample data only, nothing is saved. Click pins, use the Needs You items, or type in the terminal:
  help, tap <rack>, deny <rack>, shake <rack>, ack <rack>, open <rack>, racks, clear.
  (Mockups A, B2 and B3 are in git history at commit 6e1400c.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Admin Mockup · HokieBikeRack</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="../app/css/tokens.css">
  <link rel="stylesheet" href="mockup.css">
  <script src="../vendor/rive/rive.js" defer></script>
  <script type="module" src="mockup.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#"><span class="brand-mark" id="brand-mark"></span>HokieBikeRack</a>
    <nav class="top-nav" aria-label="Pages">
      <a href="#" aria-current="page">Map</a>
      <a href="#">Reports</a>
      <a href="#">Audit Log</a>
    </nav>
    <span class="top-summary" id="summary"></span>
    <span class="top-user">admin</span>
  </header>

  <main class="stage">
    <section class="map-area" aria-label="Campus map">
      <div id="map" class="map"></div>

      <!-- Rack panel: slides in over the left of the map when a rack is opened -->
      <aside class="panel" id="panel" aria-label="Rack" hidden>
        <div class="panel-scene" id="panel-scene"></div>
        <button class="panel-close" id="panel-close" type="button">Close</button>
        <div id="panel-body"></div>
      </aside>

      <!-- New-alarm pop-up -->
      <div class="alarm-pop" id="alarm-pop" role="alert" hidden>
        <div class="alarm-scene" id="alarm-scene"></div>
        <div class="alarm-text">
          <b>Tamper Alarm</b>
          <span id="alarm-where"></span>
          <span class="siren"><span class="siren-bar" id="siren-bar"></span></span>
          <span class="siren-note" id="siren-note">Siren on for 10 s</span>
          <div class="alarm-actions"><button class="btn btn-primary" id="alarm-open" type="button">Open Rack</button><button class="btn btn-quiet" id="alarm-dismiss" type="button">Dismiss</button></div>
        </div>
      </div>

      <section class="needs" aria-label="Needs you">
        <span class="needs-title">Needs You</span>
        <div class="needs-items" id="needs"></div>
      </section>
    </section>

    <section class="term" aria-label="Terminal">
      <div class="term-head"><span class="term-signal" id="term-signal"></span><span>terminal</span><span class="term-hint">type help</span></div>
      <div class="term-feed" id="feed" aria-live="polite"></div>
      <form class="term-prompt" id="prompt" autocomplete="off">
        <label class="term-ps" for="cmd">admin $</label>
        <input id="cmd" class="term-input" spellcheck="false" autocapitalize="off" placeholder="tap newman">
      </form>
    </section>
  </main>
</body>
</html>
